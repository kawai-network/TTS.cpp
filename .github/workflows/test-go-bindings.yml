name: Go Bindings Tests

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'bindings/go/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'bindings/go/**'
  workflow_dispatch:

jobs:
  test-go-bindings:
    name: Test Go Bindings (${{ matrix.os }}, Go ${{ matrix.go-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.21', '1.22', '1.23']
        include:
          - os: ubuntu-latest
            goos: linux
          - os: macos-latest
            goos: darwin
          - os: windows-latest
            goos: windows
    
    runs-on: ${{ matrix.os }}
    
    defaults:
      run:
        working-directory: ./bindings/go
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-
    
    - name: Download dependencies
      run: |
        go mod download
        go mod verify
    
    - name: Run unit tests (CGO disabled)
      run: |
        go test -v -race -coverprofile=coverage.out ./... 2>&1 | tee test-output.log
      env:
        CGO_ENABLED: 0
    
    - name: Run benchmarks
      run: |
        go test -bench=. -benchtime=1s ./... 2>&1 | tee benchmark-output.log
      env:
        CGO_ENABLED: 0
    
    - name: Check code formatting
      run: |
        gofmt -d .
        if [ -n "$(gofmt -l .)" ]; then
          echo "Code is not formatted. Please run: gofmt -w ."
          exit 1
        fi
      shell: bash
    
    - name: Run go vet
      run: |
        go vet ./...
      env:
        CGO_ENABLED: 0
    
    - name: Check for race conditions
      run: |
        go test -race ./...
      env:
        CGO_ENABLED: 0
    
    - name: Generate coverage report
      run: |
        go tool cover -html=coverage.out -o coverage.html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.go-version == '1.21' && matrix.os == 'ubuntu-latest'
      with:
        files: ./bindings/go/coverage.out
        flags: go-bindings
        name: go-bindings-coverage
        fail_ci_if_error: false
    
    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-go${{ matrix.go-version }}
        path: |
          ./bindings/go/test-output.log
          ./bindings/go/benchmark-output.log
          ./bindings/go/coverage.html
        if-no-files-found: ignore

  cross-compile:
    name: Cross Compilation Tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: freebsd
            goarch: amd64
    
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./bindings/go
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Download dependencies
      run: go mod download
    
    - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
      run: |
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v ./...
      env:
        CGO_ENABLED: 0
    
    - name: Test compilation
      run: |
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o tts-bindings-test ./example/
      env:
        CGO_ENABLED: 0
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: tts-bindings-${{ matrix.goos }}-${{ matrix.goarch }}
        path: ./bindings/go/tts-bindings-test
        if-no-files-found: ignore

  lint:
    name: Lint Go Code
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./bindings/go
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Download dependencies
      run: go mod download
    
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        working-directory: ./bindings/go
        args: --timeout=5m --issues-exit-code=0
    
    - name: Check for vulnerabilities
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...
      continue-on-error: true

  integration-test:
    name: Integration Test (with Library)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    defaults:
      run:
        working-directory: ./bindings/go
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Build C API library
      run: |
        cd ../..
        cmake -B build-c-api -DBUILD_SHARED_LIBS=ON -DTTS_BUILD_EXAMPLES=OFF -DTTS_BUILD_C_API=ON
        cmake --build build-c-api --config Release --parallel
    
    - name: Install library
      run: |
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          sudo cp ../../build-c-api/bindings/go/libtts_c_api.dylib /usr/local/lib/
          sudo cp ../../build-c-api/ggml/src/libggml*.dylib /usr/local/lib/
          sudo update_dyld_shared_cache
        else
          sudo cp ../../build-c-api/bindings/go/libtts_c_api.so /usr/lib/
          sudo cp ../../build-c-api/ggml/src/libggml*.so /usr/lib/
          sudo ldconfig
        fi
      shell: bash
    
    - name: Run integration tests
      run: |
        go test -v -tags=integration ./...
      env:
        CGO_ENABLED: 0
      continue-on-error: true  # Integration tests may fail without model files

  test-summary:
    name: Test Summary
    needs: [test-go-bindings, cross-compile, lint]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Display test summary
      run: |
        echo "## Go Bindings Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Test Results" >> $GITHUB_STEP_SUMMARY
        echo "| OS | Go Version | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|----|------------|--------|" >> $GITHUB_STEP_SUMMARY
        
        for os in ubuntu-latest macos-latest windows-latest; do
          for gover in 1.21 1.22 1.23; do
            artifact="artifacts/test-results-${os}-go${gover}"
            if [ -f "${artifact}/test-output.log" ]; then
              if grep -q "PASS" "${artifact}/test-output.log"; then
                echo "| ${os} | ${gover} | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| ${os} | ${gover} | ❌ Fail |" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "| ${os} | ${gover} | ⚠️ Missing |" >> $GITHUB_STEP_SUMMARY
            fi
          done
        done
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Cross-Compilation Results" >> $GITHUB_STEP_SUMMARY
        echo "All cross-compilation targets built successfully!" >> $GITHUB_STEP_SUMMARY
      shell: bash
